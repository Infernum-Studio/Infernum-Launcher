[package]
name = "infernum-launcher"
version = "1.0.0"
description = "Infernum Launcher"
authors = ["Infernum Studio"]
license = "GPL-3.0-only"
repository = "https://github.com/Infernum-Studio/Infernum-Launcher"
edition = "2024"
rust-version = "1.90"

[lib]
name = "infernum_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

theseus = { git = "https://github.com/Infernum-Studio/theseus", branch = "infernum" }

base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
flate2 = "1"
futures = "0.3"
hex = "0.4"
log = "0.4"
md-5 = "0.10"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
